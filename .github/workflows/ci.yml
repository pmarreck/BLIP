name: CI

on:
  push:
    branches: [yolo]
  pull_request:
    branches: [yolo]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          flakehub-token: ${{ secrets.FLAKEHUB_TOKEN }}

      - name: Build
        run: nix build

      - name: Check devShell
        run: nix develop --command echo "devShell OK"
